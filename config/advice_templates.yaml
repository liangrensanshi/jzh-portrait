R01: |
  本季度存在月末集中记账现象：{trigger_months}月份21日后创建的记录占该月总数{ratio_pct}%，
  请核实是否存在滞后补记，提醒住户养成每日记账习惯。

R02: |
  本季度存在连续{gap_days}天无消费类记录（{gap_start}至{gap_end}），
  请核实该时段是否确无消费支出，或是否存在漏记情况。

R03: |
  本季度存在连续{gap_days}天无消费类记录（{gap_start}至{gap_end}），
  断记时间较长，请重点核查是否存在漏记，必要时要求补录。

R04: |
  本季度食品烟酒类（31xx）记录数为0，正常家庭不应全季无食品支出，
  请核实是否存在大量漏记，重点询问日常买菜、餐饮等记录情况。

R07: |
  本季度消费总额{consume_total}元，收入总额{income_total}元，
  消费率仅{ratio_pct}%，低于正常水平，请核实是否有大量消费未记账。

R10: |
  本季度{missing_months}月份账页记录数为0，整月断记，
  请核实该月是否确无任何收支，或是否存在批量漏记。

L01: |
  家中有学龄成员（年龄{child_age_range}岁），但本季度教育支出仅{consume_edu}元，
  日常学习用品、培训、教辅、伙食费等是否完整记录，请重点核查。

L04: |
  家庭有{retired_count}位离退休成员，但本季度转移性收入{income_transfer}元，
  人均{per_capita}元，明显低于正常养老金水平，请核实养老金是否足额记账。

L05: |
  本季度无在业家庭成员，但工资性收入为{income_wage}元，
  请核实收入来源是否记录在正确的编码下，或就业状态填写是否有误。

L08: |
  本季度收入总额{income_total}元，消费支出{consume_total}元，非消费支出{nonconsume_total}元，
  收支差额{balance}元，差异率{deviation_pct}%，请核实是否有重大收支未记录。

L09: |
  家庭常住{family_size_permanent}人，但本季度食品消费{consume_food}元，
  人均日食品支出仅{food_per_day}元，低于正常水平，请核实食品消费是否完整记账。

N01: |
  本季度存在单笔金额异常大的记录（{large_item}，金额{large_amount}元），
  超过季度收入{ratio_pct}%，请核实是否为误录或金额单位错误。

N02: |
  本季度{top_category}支出{top_amount}元，占消费总额{ratio_pct}%，比例异常偏高，
  请核实其他类别是否存在漏记。

Q01: |
  本季度有{count}笔金额超过200元的记录缺少品名，
  请提醒住户补充记录具体品名，以便审核和分析。

Q02: |
  本季度有{issue_count}条记录被系统标记为问题记录，
  请逐一核查标记原因，确认是否需要修正。

L02: |
  家庭有车辆但本季度无燃油或相关费用记录，请核查是否漏记交通支出。

L03: |
  家庭有新生儿但本季度无相关支出记录，请核查是否漏记婴幼儿相关支出。

R05: |
  本季度消费类别覆盖严重不足，请核查是否存在多类消费漏记。

R11: |
  检测到疑似大额补记，请核查记账日期与消费日期是否一致。
